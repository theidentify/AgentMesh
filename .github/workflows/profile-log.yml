name: profile-log tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'profile-log/**'
      - '.github/workflows/profile-log.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: profile-log/gateway/package-lock.json
      - name: Install pinned gateway dependencies for cross-implementation tests
        working-directory: profile-log/gateway
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: profile-log/requirements*.txt
      - name: Install pinned dependencies
        run: python -m pip install -r profile-log/requirements-dev.txt
      - name: Test from the repository root
        run: python -m pytest -q -rs -p no:cacheprovider --basetemp "${{ runner.temp }}/profile-log-root" profile-log/tests
      - name: Test from the package directory
        working-directory: profile-log
        run: python -m pytest -q -rs -p no:cacheprovider --basetemp "${{ runner.temp }}/profile-log-pkg" tests

  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: profile-log/gateway/package-lock.json
      - name: Install pinned dependencies
        working-directory: profile-log/gateway
        run: npm ci
      - name: Test Worker offline
        working-directory: profile-log/gateway
        run: node --test
