<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 976 604" width="976" height="604" role="img" aria-label="An explicit resolution keeps the companion rows" font-family="'IBM Plex Sans Thai','Noto Sans Thai','Sukhumvit Set',Thonburi,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
<style>
.bg{fill:#FFFFFF}.ttl{fill:#1F1E1C}.cap{fill:#8C8880}
.grp{fill:#F4F3EF;stroke:#CFCBC2}.glbl{fill:#6F6C66}
.nd{fill:#FBFAF7;stroke:#CFCBC2}.nt{fill:#1F1E1C}.nb{fill:#3A3935}.nm{fill:#8C8880}
.hl{fill:#DDE7F2;stroke:#3D7BD6}.rj{fill:#FFFFFF;stroke:#C8473D}.ex{fill:#FFFFFF;stroke:#CFCBC2}
.ar{stroke:#B3AFA6}.ah{fill:#B3AFA6}.elb{fill:#6F6C66}.elbg{fill:#FFFFFF}
@media (prefers-color-scheme: dark){
.bg{fill:#1E1D1B}.ttl{fill:#F1EFEA}.cap{fill:#8F8B83}
.grp{fill:#262522;stroke:#4A4740}.glbl{fill:#A29E95}
.nd{fill:#2B2A27;stroke:#4A4740}.nt{fill:#F1EFEA}.nb{fill:#D6D3CC}.nm{fill:#8F8B83}
.hl{fill:#1F3550;stroke:#5B9BEF}.rj{fill:#1E1D1B;stroke:#E0675C}.ex{fill:#1E1D1B;stroke:#4A4740}
.ar{stroke:#6D6A63}.ah{fill:#6D6A63}.elb{fill:#A29E95}.elbg{fill:#1E1D1B}}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="976" height="604" rx="16"/>
<text class="ttl" x="28" y="52" font-size="22" font-weight="700">An explicit resolution keeps the companion rows</text>
<rect class="grp" x="28" y="84" width="301" height="340" rx="18" stroke-width="1.5" stroke-dasharray="7 6"/>
<text class="glbl" x="50" y="112" font-size="15">Device A</text>
<rect class="grp" x="656" y="84" width="292" height="340" rx="18" stroke-width="1.5" stroke-dasharray="7 6"/>
<text class="glbl" x="678" y="112" font-size="15">Device B</text>
<path class="ar" d="M178.5,228.0 L178.5,292.0" fill="none" stroke-width="1.6" marker-end="url(#ah)"/>
<path class="ar" d="M802.0,228.0 L802.0,260.0 L178.5,260.0 L178.5,292.0" fill="none" stroke-width="1.6" marker-end="url(#ah)"/>
<path class="ar" d="M307.0,347.0 L371.0,347.0" fill="none" stroke-width="1.6" marker-end="url(#ah)"/>
<path class="ar" d="M614.0,347.0 L678.0,347.0" fill="none" stroke-width="1.6" marker-end="url(#ah)"/>
<path class="ar" d="M802.0,402.0 L802.0,466.0" fill="none" stroke-width="1.6" marker-end="url(#ah)"/>
<path class="ar" d="M178.5,402.0 L178.5,466.0" fill="none" stroke-width="1.6" marker-end="url(#ah)"/>
<rect class="nd" x="50" y="140" width="257" height="88" rx="12" stroke-width="1.5"/>
<text class="nt" x="72" y="179" font-size="17" font-weight="700">A · Local edit</text>
<text class="nb" x="72" y="205" font-size="14.5">Same record, local choice</text>
<rect class="nd" x="678" y="140" width="248" height="88" rx="12" stroke-width="1.5"/>
<text class="nt" x="700" y="179" font-size="17" font-weight="700">B · Conflicting edit</text>
<text class="nb" x="700" y="205" font-size="14.5">Same origin, different choice</text>
<rect class="nd" x="50" y="292" width="257" height="110" rx="12" stroke-width="1.5"/>
<text class="nt" x="72" y="331" font-size="17" font-weight="700">Review and choose</text>
<text class="nb" x="72" y="357" font-size="14.5">Workers stopped; activated</text>
<text class="nb" x="72" y="379" font-size="14.5">Inspect → preview → RESOLVE</text>
<rect class="hl" x="371" y="292" width="243" height="110" rx="12" stroke-width="2.5"/>
<text class="nt" x="393" y="331" font-size="17" font-weight="700">Resolution packet</text>
<text class="nb" x="393" y="357" font-size="14.5">Chosen rows + companions</text>
<text class="nb" x="393" y="379" font-size="14.5">References covered packets</text>
<rect class="nd" x="678" y="292" width="248" height="110" rx="12" stroke-width="1.5"/>
<text class="nt" x="700" y="331" font-size="17" font-weight="700">Receive on B</text>
<text class="nb" x="700" y="357" font-size="14.5">receive-only</text>
<text class="nb" x="700" y="379" font-size="14.5">Validate choice and evidence</text>
<rect class="rj" x="50" y="466" width="257" height="110" rx="12" stroke-width="2" stroke-dasharray="7 6"/>
<text class="nt" x="72" y="505" font-size="17" font-weight="700">Never delete packets</text>
<text class="nb" x="72" y="531" font-size="14.5">History proves the decision</text>
<text class="nb" x="72" y="553" font-size="14.5">No silent overwrite</text>
<rect class="nd" x="678" y="466" width="248" height="110" rx="12" stroke-width="1.5"/>
<text class="nt" x="700" y="505" font-size="17" font-weight="700">Check, then restart</text>
<text class="nb" x="700" y="531" font-size="14.5">Compare records on A and B</text>
<text class="nb" x="700" y="553" font-size="14.5">Explicit worker-start</text>
</svg>
